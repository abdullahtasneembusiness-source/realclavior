name: Generate video

# Manually triggered pipeline for the "Margin of error" channel.
# Runs on GitHub's machines (open internet), reads API keys from repo secrets,
# and hands back the generated media as downloadable artifacts.
#
# Each media step is independent (continue-on-error) so one service having a
# plan/billing issue never blocks the others — whatever succeeds is uploaded.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder under moe/episodes/"
        default: "largay"
        required: true
      steps:
        description: "What to generate — never spend on both unless you mean to"
        type: choice
        default: "images"
        options: ["images", "voice", "both"]
      voice_mode:
        description: "voice: 'sample' = first ~600 chars only (cheap A/B). 'full' = whole script."
        type: choice
        default: "sample"
        options: ["sample", "full"]
      voice_ids:
        description: "Optional comma-separated ElevenLabs voice IDs to A/B against the sample"
        default: ""
      sample_chars: 
        description: "voice sample length in characters (~20s per 320)"
        default: "320"
      only:
        description: "images: generate ONLY this scene name (§1.3 one-before-many). Blank = whole set."
        default: ""
      model:
        description: "Replicate model for stills"
        type: choice
        default: "black-forest-labs/flux-1.1-pro"
        options:
          - "black-forest-labs/flux-1.1-pro"
          - "black-forest-labs/flux-dev"
          - "black-forest-labs/flux-schnell"

jobs:
  media:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit generated stills back to the episode folder
    env:
      # Map every plausible secret name → the scripts pick whichever is set.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
      ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
      XI_API_KEY: ${{ secrets.XI_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      VOICE_ID: ${{ secrets.VOICE_ID }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
      REPLICATE_MODEL: ${{ secrets.REPLICATE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight — which secrets are visible (values never printed)
        run: |
          check() { if [ -n "$2" ]; then echo "✅ $1 is set"; else echo "❌ $1 is NOT set"; fi; }
          echo "Checking repo secrets are readable by this job:"
          check ELEVENLABS_API_KEY  "$ELEVENLABS_API_KEY"
          check ELEVENLABS_VOICE_ID "$ELEVENLABS_VOICE_ID"
          check "REPLICATE token"   "${REPLICATE_API_TOKEN}${REPLICATE_API_KEY}"

      # SCRIPT.md is the single source of truth; script.txt is derived from it.
      - name: Build narration text from SCRIPT.md
        run: node moe/scripts/strip-script.mjs "${{ inputs.episode }}"

      - name: Generate voiceover (ElevenLabs)
        id: voiceover
        if: inputs.steps == 'voice' || inputs.steps == 'both'
        continue-on-error: true
        env:
          VOICE_MODE: ${{ inputs.voice_mode }}
          VOICE_IDS: ${{ inputs.voice_ids }}
          SAMPLE_CHARS: ${{ inputs.sample_chars }}
        run: node moe/scripts/generate-voiceover.mjs "moe/episodes/${{ inputs.episode }}/script.txt" "moe/out/voiceover.mp3"

      - name: Generate images (Replicate / Flux)
        id: images
        if: inputs.steps == 'images' || inputs.steps == 'both'
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
          REPLICATE_MODEL: ${{ inputs.model }}
        run: node moe/scripts/generate-images.mjs "moe/episodes/${{ inputs.episode }}/images.json" "moe/episodes/${{ inputs.episode }}/stills"

      # Stills are committed so they're versioned, reviewable in the repo, and
      # available to the Remotion render as ordinary files. The voiceover stays
      # artifact-only — it's large and regenerated from SCRIPT.md on demand.
      - name: Commit generated stills
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "moe/episodes/${{ inputs.episode }}/stills" costs.jsonl || true
          if git diff --cached --quiet; then
            echo "No new stills to commit."
          else
            git commit -m "Add generated stills for ${{ inputs.episode }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload media artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ inputs.episode }}
          path: |
            moe/out/**
            moe/episodes/${{ inputs.episode }}/stills/**
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Pipeline results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voiceover: ${{ steps.voiceover.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Images: ${{ steps.images.outcome }}" >> "$GITHUB_STEP_SUMMARY"
